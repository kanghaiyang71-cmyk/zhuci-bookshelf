name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Zhuci Bookshelf
    runs-on: ubuntu-latest

    steps:
      # 1. 下载仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 安装 Android SDK
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ] && [ -x "$SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$SDK_ROOT" -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK installation completed."

      # 4. 配置 Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 5. 解压 Android 工程
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import PurePosixPath

          archive = "逐词书架_Android工程首版.zip"
          output = "extracted"

          if not os.path.isfile(archive):
              raise SystemExit("ERROR: Project ZIP not found: " + archive)

          os.makedirs(output, exist_ok=True)

          with zipfile.ZipFile(archive) as z:
              bad_file = z.testzip()

              if bad_file:
                  raise SystemExit("ERROR: Corrupted ZIP entry: " + bad_file)

              for item in z.infolist():
                  try:
                      name = item.filename.encode("cp437").decode("utf-8")
                  except UnicodeEncodeError:
                      name = item.filename

                  parts = PurePosixPath(name).parts

                  if len(parts) < 2:
                      continue

                  rel = PurePosixPath(*parts[1:])

                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit("ERROR: Unsafe ZIP path: " + name)

                  target = os.path.join(output, *rel.parts)

                  if item.is_dir():
                      os.makedirs(target, exist_ok=True)
                  else:
                      os.makedirs(os.path.dirname(target), exist_ok=True)

                      with z.open(item) as src:
                          with open(target, "wb") as dst:
                              while True:
                                  data = src.read(1024 * 1024)
                                  if not data:
                                      break
                                  dst.write(data)

          required_files = [
              "settings.gradle",
              "build.gradle",
              "gradle.properties",
              "app/build.gradle",
              "app/src/main/AndroidManifest.xml",
              "app/src/main/assets/reader.html",
          ]

          missing = []

          for file in required_files:
              path = os.path.join(output, file)
              if not os.path.isfile(path):
                  missing.append(path)

          if missing:
              raise SystemExit(
                  "ERROR: Missing project files:\n" + "\n".join(missing)
              )

          print("ZIP integrity check passed.")
          print("Project extraction completed.")
          print("All required Android project files were found.")
          PY

      # 6. 统一 Java 和 Kotlin 编译目标为 17
      - name: Align Java and Kotlin JVM targets
        working-directory: extracted
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle")

          if not path.is_file():
              raise SystemExit("ERROR: app/build.gradle not found")

          text = path.read_text(encoding="utf-8")

          if "android {" not in text:
              raise SystemExit("ERROR: android block not found")

          if "compileOptions" in text or "kotlinOptions" in text:
              raise SystemExit(
                  "ERROR: Existing JVM configuration detected. "
                  "Please inspect app/build.gradle before modifying it."
              )

          configuration = """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          """

          text = text.replace("android {", configuration, 1)
          path.write_text(text, encoding="utf-8")

          print("Java sourceCompatibility: 17")
          print("Java targetCompatibility: 17")
          print("Kotlin jvmTarget: 17")
          PY

          echo "Verifying JVM target configuration..."
          grep -A 8 '^android {' app/build.gradle

      # 7. 检查工程配置
      - name: Verify project configuration
        shell: bash
        run: |
          set -e

          cd extracted

          grep -q "com.android.application" build.gradle
          grep -q "8.7.3" build.gradle
          grep -q "2.0.21" build.gradle

          grep -q "compileSdk 35" app/build.gradle
          grep -q "minSdk 23" app/build.gradle
          grep -q "sourceCompatibility JavaVersion.VERSION_17" app/build.gradle
          grep -q "targetCompatibility JavaVersion.VERSION_17" app/build.gradle
          grep -q "jvmTarget = '17'" app/build.gradle

          echo "Project configuration checks passed."

      # 8. 编译 APK
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd extracted

          gradle --no-daemon --stacktrace :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK build successful."
          ls -lh "$APK"

      # 9. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhuci-bookshelf-debug-apk
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
